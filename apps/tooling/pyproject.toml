[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-tooling"
version = "0.2.0"
description = "Developer tooling, market simulator and load generator for the exchange platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "websockets>=12",
    "yfinance>=0.2.40",
]

[project.scripts]
exchange-tooling = "exchange_tooling.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
